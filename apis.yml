name: Best Practice Software
kind: company
description: >-
  Best Practice Software is an Australian clinical and practice-management software
  company, headquartered in Bundaberg, Queensland, and one half of the Australian
  GP-software duopoly (alongside MedicalDirector). Its flagship products - Bp Premier
  (general practice), Bp VIP.net (specialist and allied), and Bp Allied - run in
  thousands of Australian medical practices. Best Practice's programmatic surface is
  delivered through Halo Connect (Halo Cloud / Halo Link), a FHIR-based integration
  platform that lets approved partners query practice data over a modern API instead
  of the legacy SQL database. The FHIR API for Bp Premier is built to the AU Base 4.1.0
  implementation guide, falling back to HL7 FHIR R4 (4.0.1), and exposes resources
  such as Patient, Appointment, Slot (Find Free Slots) and a Patient $summary document.
  Halo Cloud also offers SQL Passthrough and Registered Queries for structured
  practice data. Access is gated - integrators require a Halo Cloud subscription plus
  per-practice pairing and PMS-managed database credentials, authenticated with an
  Azure API Management subscription key (desktop apps additionally use a bearer JWT and
  device id). This is not a self-serve public API; it is a partner-onboarded,
  standards-aligned interoperability layer for the Australian primary-care market.
