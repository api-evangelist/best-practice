apis:
- aid: best-practice:halo-cloud-integrator-api
  name: Halo Cloud API for Integrators
  description: >-
    The integrator-facing Halo Cloud API from Best Practice's Halo Connect platform.
    Lets approved partners query Bp Premier practice data by four means - Sites
    (retrieve site metadata and onboarding info), SQL Passthrough (execute SQL against
    the practice database), FHIR (search practice data as HL7 FHIR R4 resources), and
    Registered Queries (recurring SQL). OpenAPI 3.1.1, authenticated with an Azure API
    Management subscription key (Ocp-Apim-Subscription-Key header); every call requires
    an active pairing with the target site.
  humanURL: https://docs.haloconnect.io/api-reference/integrator-openapi.html
  baseURL: https://api.haloconnect.io
  tags:
  - FHIR
  - Healthcare
  - Interoperability
  - SQL Passthrough
  properties:
  - type: OpenAPI
    url: openapi/haloconnect-integrator-openapi.json
  - type: APIReference
    url: https://docs.haloconnect.io/api-reference/integrator-openapi.html
  - type: Documentation
    url: https://docs.haloconnect.io/halo-cloud/overview/
  - type: GettingStarted
    url: https://docs.haloconnect.io/halo-cloud/getting-started/
- aid: best-practice:halo-cloud-desktop-api
  name: Halo Cloud API for Desktop Applications
  description: >-
    The desktop-application-facing Halo Cloud API from Halo Connect. Provides a token
    endpoint plus SQL Passthrough and FHIR query access for locally installed
    applications integrating with Bp Premier. OpenAPI 3.1.1, authenticated with an
    Azure API Management subscription key together with a bearer JWT and a DeviceId
    header identifying the calling device.
  humanURL: https://docs.haloconnect.io/api-reference/desktop-openapi.html
  baseURL: https://api.haloconnect.io
  tags:
