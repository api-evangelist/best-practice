  - type: GettingStarted
    url: https://docs.haloconnect.io/halo-cloud/getting-started/
- aid: best-practice:fhir-api-bp-premier
  name: FHIR API for Bp Premier
  description: >-
    The HL7 FHIR API for Best Practice Bp Premier, delivered through Halo Connect. Built
    to the AU Base 4.1.0 implementation guide, falling back to FHIR R4 (4.0.1) where
    needed. Resources are served under the base path
    https://api.haloconnect.io/integrator/sites/{siteId}/fhir/R4/ with a
    CapabilityStatement at {baseUrl}/metadata; documented resources and operations
    include Patient, Appointment, Slot (Find Free Slots) and a Patient $summary
    document. The per-Bp-Premier resource mappings are published as a FHIR
    Implementation Guide in the Bp Premier knowledge base (login required). Access is
    gated to approved Best Practice partners; the FHIR search operations are also
    described in the Halo Cloud Integrator OpenAPI.
  humanURL: https://docs.haloconnect.io/halo-cloud/fhir-api/overview/
  baseURL: https://api.haloconnect.io/integrator/sites/{siteId}/fhir/R4
  tags:
  - FHIR
