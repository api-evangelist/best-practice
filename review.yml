actions:
  openapiHarvested: true
  specsSaved: 2
  fhirCapabilityCaptured: false
  reason: |
    Two real OpenAPI 3.1.1 specifications were harvested verbatim from the Halo
    Connect Redoc reference pages and saved under openapi/. A live FHIR
    CapabilityStatement exists at {baseUrl}/metadata but is gated behind a site
    GUID and subscription key, so none was captured and none was invented. The
    apis.yml catalogs the three real, documented products: the Halo Cloud
    Integrator API, the Halo Cloud Desktop API, and the FHIR API for Bp Premier.
